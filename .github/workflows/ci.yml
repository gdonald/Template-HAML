name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  HAML_BENCH_ITERS: 10
  HAML_RUN_BENCH: 1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [prove6-direct, prove6-ast, behave]
    name: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: Raku/setup-raku@v1
        with:
          raku-version: 'latest'
      - name: Raku version
        run: raku --version
      - name: Cache zef
        uses: actions/cache@v4
        with:
          path: ~/.zef
          key: zef-ubuntu-latest-${{ hashFiles('META6.json') }}
          restore-keys: |
            zef-ubuntu-latest-
      - name: Install dependencies
        run: zef install --deps-only --/test --test-depends .
      - name: Install prove6
        if: matrix.stage != 'behave'
        run: zef install --/test App::Prove6
      - name: Run tests
        run: ./test.raku ${{ matrix.stage }}

  benchmark:
    runs-on: ubuntu-latest
    name: benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: Raku/setup-raku@v1
        with:
          raku-version: 'latest'
      - name: Raku version
        run: raku --version
      - name: Cache zef
        uses: actions/cache@v4
        with:
          path: ~/.zef
          key: zef-ubuntu-latest-${{ hashFiles('META6.json') }}
          restore-keys: |
            zef-ubuntu-latest-

      - name: Install from git
        run: |
          zef install --/test --force-install https://github.com/gdonald/BDD-Behave.git

      - name: Install dependencies
        run: zef install --deps-only --/test --test-depends .
      - name: Run benchmarks
        run: behave --benchmark specs/bench/
