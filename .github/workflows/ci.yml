name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Raku/setup-raku@v1
        with:
          raku-version: 'latest'
      - name: Raku version
        run: raku --version
      - name: Install dependencies
        run: zef install --deps-only --/test --test-depends .
      - name: Install prove6
        run: zef install --/test App::Prove6
      - name: Run tests
        run: prove6 -Ilib t/
