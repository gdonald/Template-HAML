name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAML_BENCH_ITERS: 10
      HAML_RUN_BENCH: 1
    steps:
      - uses: actions/checkout@v4
      - uses: Raku/setup-raku@v1
        with:
          raku-version: 'latest'
      - name: Raku version
        run: raku --version
      - name: Cache zef
        uses: actions/cache@v4
        with:
          path: ~/.zef
          key: zef-ubuntu-latest-${{ hashFiles('META6.json') }}
          restore-keys: |
            zef-ubuntu-latest-
      - name: Install dependencies
        run: zef install --deps-only --/test --test-depends .
      - name: Install prove6
        run: zef install --/test App::Prove6
      - name: Run tests
        run: ./test.raku
      - name: Run benchmarks
        run: behave --benchmark specs/bench/
